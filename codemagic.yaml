# Personal account + M2 uses the free allowance. Start manually; no webhooks.
# Configure the Apple integration and both target profiles before starting.
workflows:
  ios-testflight:
    name: Outfit League iPhone beta
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 24.19.0
      xcode: "27.1"
      cocoapods: default
      groups:
        - outfit_league
      ios_signing:
        provisioning_profiles:
          - outfit-league-main-push
          - outfit-league-share
        certificates:
          - Outfit League certificate
      vars: &app_vars
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
        EXPO_PUBLIC_APP_URL: https://chutni.store
        EXPO_PUBLIC_SUPABASE_URL: https://xxrylsmiaehgnljyzguh.supabase.co
        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HecThul_Ql3yp1tmG3_fVA_JYq94elU
        # RevenueCat public iOS SDK key; public by design and must match the app configuration.
        EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: appl_bCXFpGysWSsDnCwlqxbYfEuwAHo
        EXPO_PUBLIC_APPLE_SANDBOX_TESTING: "true"
        # PostHog project token: write-only, safe to ship in the app.
        EXPO_PUBLIC_POSTHOG_KEY: phc_p7a7jjnL3h9ng7Tjnudn6rtx6SxTgHu2Sdh8GNkr6JJf
    scripts:
      - name: Install locked dependencies
        script: |
          set -eu
          npm install --global --force pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check source
        script: |
          set -eu
          pnpm typecheck
          pnpm test
      - name: Generate iOS project and install pods
        script: |
          set -eu
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const number = Number(process.env.PROJECT_BUILD_NUMBER);
          if (!Number.isInteger(number) || number < 1 || number > 9899) {
            throw new Error('Missing/out-of-range Codemagic project build number');
          }
          config.expo.ios.buildNumber = String(100 + number);
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          NODE
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Apply signing profiles for app and share extension
        script: |
          set -eu
          xcode-project use-profiles
      - name: Archive and export signed iPhone app
        script: |
          set -eu
          xcode-project build-ipa --workspace ios/OutfitLeague.xcworkspace --scheme OutfitLeague
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Apple distributes processed uploads through the existing internal
        # "Owner auto" group. Beta review is only needed for external testers.
        submit_to_testflight: false
        submit_to_app_store: false

  # Builds for the iPhone simulator and opens the app. Uploads nothing.
  ios-launch-check:
    name: Outfit League launch check (no upload)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24.19.0
      xcode: "27.1"
      cocoapods: default
      vars: *app_vars
    scripts:
      - name: Install locked dependencies
        script: |
          set -eu
          npm install --global --force pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check source
        script: |
          set -eu
          pnpm typecheck
          pnpm test
      - name: Generate iOS project and install pods
        script: |
          set -eu
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Build for the simulator
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -workspace ios/OutfitLeague.xcworkspace -scheme OutfitLeague \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim build > build/xcodebuild.log 2>&1 \
            || { grep -E "error:|\*\* BUILD" build/xcodebuild.log | tail -60; exit 1; }
      - name: Open the app and confirm it stays open
        script: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS-27" in k for x in d[k] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Release-iphonesimulator/OutfitLeague.app
          xcrun simctl launch "$UDID" com.outfitleague.app
          sleep 30
          xcrun simctl io "$UDID" screenshot build/launch.png
          xcrun simctl spawn "$UDID" launchctl list | grep com.outfitleague.app \
            || { echo "The app closed after launch."; ls ~/Library/Logs/DiagnosticReports || true; exit 1; }
    artifacts:
      - build/launch.png
      - build/xcodebuild.log
      - /Users/builder/Library/Logs/DiagnosticReports/*.ips
